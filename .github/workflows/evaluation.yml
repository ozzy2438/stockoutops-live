# Governance notice only. Exact-head CI runs the controlled-synthetic M2 foundation.
# Genuine G0/G1/UAT evaluation remains disabled until separately authorised.
name: evaluation-boundary

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Evidence boundary to display (this workflow runs no evaluation)"
        required: true
        default: "simulated-shadow-foundation"
        type: choice
        options: [simulated-shadow-foundation, replay, genuine-shadow, uat-summary]

jobs:
  boundary-notice:
    name: Evaluation boundary notice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Confirm this workflow makes no gate claim
        run: |
          echo "No evaluation was executed by this notice workflow."
          echo "M2 controlled-synthetic engineering checks run in ci.yml."
          echo "Genuine G0/G1/UAT evaluation remains pending under docs/08_evaluation_plan.md."
