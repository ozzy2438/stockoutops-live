# Milestone-0 notice only. No evaluation harness or cases exist yet.
# Enable blocking evaluation jobs only after M0 approval and implementation.
name: evaluation-scaffold

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Planned future mode (no evaluation runs in M0)"
        required: true
        default: "replay"
        type: choice
        options: [replay, shadow, uat-summary]

jobs:
  m0-notice:
    name: M0 scaffold notice (not an evaluation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm evaluation is not implemented
        run: |
          echo "No evaluation was executed. This is a Milestone-0 scaffold notice."
          echo "See docs/08_evaluation_plan.md and evaluation/replay/README.md."
