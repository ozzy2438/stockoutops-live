# Evaluation harness: golden cases, shadow-mode diffs, replay.
# This is a skeleton — real steps come in M1+.
name: evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "evaluation/**"
      - "src/**"
      - ".github/workflows/evaluation.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which eval to run"
        required: true
        default: "replay"
        type: choice
        options: [replay, shadow, uat-summary]

jobs:
  replay:
    name: Historical replay (G0)
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'replay' || github.event_name == 'pull_request'
