# CI — repository hygiene, M1 regression, and local deterministic M2 shadow checks.
# No OpenAI secret, model network call, AWS resource, or external write is used.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lint:
    name: Docs & repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required governance files exist
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md \
                   .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md \
                   docs/00_project_charter.md docs/05_architecture_v2.md \
                   docs/07_threat_model.md docs/09_rollout_plan.md \
                   docs/12_backlog_and_milestones.md; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules

  m1-local:
    name: M1 local deterministic slice
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stockoutops
          POSTGRES_USER: stockoutops_migration
          POSTGRES_PASSWORD: migration-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockoutops_migration -d stockoutops"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: local
      IDENTITY_PROVIDER: simulated
      SIMULATED_IDENTITIES_FILE: .local/identities.json
      REASONING_PROVIDER: stub
      DATABASE_URL: postgresql://stockoutops_app:app-local-only@localhost:5432/stockoutops
      TEST_DATABASE_URL: postgresql://stockoutops_app:app-local-only@localhost:5432/stockoutops
      MIGRATION_DATABASE_URL: postgresql://stockoutops_migration:migration-local-only@localhost:5432/stockoutops
      APP_DB_PASSWORD: app-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local and test dependencies
        run: pip install -e ".[test]"
      - name: Create ignored simulated identities
        run: python scripts/create_local_identities.py
      - name: Verify fixtures and migrate empty PostgreSQL
        run: |
          python -c "from pathlib import Path; from stockoutops.evidence.manifest import verify_manifest; print(verify_manifest(Path('fixtures/v1')))"
          python -c "from pathlib import Path; from stockoutops.shadow.cases import load_case_pack; loaded = load_case_pack(Path('evaluation/shadow/cases/v1')); print(loaded.pack.case_pack_version, len(loaded.pack.cases))"
          python -m stockoutops.database
          python -m stockoutops.database
          python -m stockoutops.evidence.seed
      - name: Lint and format
        run: |
          ruff format --check .
          ruff check .
      - name: Unit and PostgreSQL integration tests
        run: pytest
      - name: Deterministic stub end-to-end smoke
        run: |
          uvicorn stockoutops.app:create_app --factory --host 127.0.0.1 --port 8000 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          python -m stockoutops.smoke
      - name: Execute-false M2 shadow pilot and deterministic reports
        run: |
          python -m stockoutops.shadow.cli \
            --git-sha "$GITHUB_SHA" \
            --test-evidence "MEASURED — full pytest completed earlier in this exact CI job."
          python -c "import json; from pathlib import Path; report = json.loads(Path('evaluation/reports/m2-shadow-foundation-pilot.json').read_text()); assert report['controls']['execute'] is False; assert report['controls']['external_action_count'] == 0; assert report['case_pack']['case_count'] >= 12; print(report['metrics'])"
      - name: Scan tracked files for common live credential patterns
        run: |
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16})' -- .; then
            echo "Potential live credential pattern found"
            exit 1
          fi
          echo "No common OpenAI or AWS access-key pattern found in tracked files."
      - name: Build application image
        run: docker build -t stockoutops-live:m1-ci .
